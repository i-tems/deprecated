# 파이프라인 B (consumer) — 별개 DAG. 자기 cron(@hourly) 유지 + 시작에
# wait_assets 센서 게이트: 같은 interval 의 demo-a asset(MinIO)이
# 준비될 때까지 reschedule 대기 후 진행 (itemflow 모델, 트리거 아님).
apiVersion: meta.i-tems.com/v1
kind: Schedule
metadata:
  name: demo-b
  labels: { owner: items }
spec:
  dag:
    interval: "@hourly"
    waitFor: ["demo-a"]
    start_date: "2026-05-18"
    catchup: false
    retries: 0
  tasks:
    - name: load
      image: python:3.12-slim
      cpu: "100m"
      memory: "128Mi"
      cmds:
        - python3
        - -c
        - |
          import datetime
          rows = [{"id": i, "v": (i * 7) % 13} for i in range(100)]
          agg = {}
          for r in rows:
              agg[r["v"]] = agg.get(r["v"], 0) + 1
          top = sorted(agg.items(), key=lambda kv: (-kv[1], kv[0]))[:3]
          print("[demo-b/load] ts=%s (demo-a wait_assets 충족 후) total=%d top3=%s"
                % (datetime.datetime.utcnow().isoformat(), sum(agg.values()), top))
  relation: |
    load
