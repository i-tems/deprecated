<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Summary - Items</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f7f7f7;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-tertiary: #737373;
            --border-color: #e5e5e5;
            --accent-color: #0066cc;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-family: 'Noto Serif KR', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-tertiary);
            font-size: 1rem;
            font-weight: 400;
        }

        .book-count {
            display: inline-block;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 100px;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .book-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .book-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .book-icon svg {
            width: 32px;
            height: 32px;
            color: var(--text-tertiary);
        }

        .book-title {
            font-family: 'Noto Serif KR', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .book-path {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            font-family: 'SF Mono', 'Consolas', monospace;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 80px 24px;
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .empty-state-icon svg {
            width: 40px;
            height: 40px;
            color: var(--text-tertiary);
        }

        .empty-state h2 {
            font-family: 'Noto Serif KR', Georgia, serif;
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-tertiary);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.875rem;
            }

            .books-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .book-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Book Summary</h1>
            <p class="subtitle">AI 기반 도서 요약 모음</p>
            {% if books %}
            <div class="book-count">{{ books|length }}권의 도서</div>
            {% endif %}
        </header>

        {% if books %}
        <div class="books-grid">
            {% for book in books %}
            <a href="{{ book.path }}" class="book-card">
                <div class="book-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <h2 class="book-title">{{ book.display_name }}</h2>
                <p class="book-path">{{ book.name }}</p>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-state">
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    <line x1="9" y1="10" x2="15" y2="10"></line>
                </svg>
            </div>
            <h2>도서가 없습니다</h2>
            <p>output 디렉토리에 처리된 도서를 추가해주세요.</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
