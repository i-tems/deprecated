# Lab convention: 평문 commit (외부 노출 owner 전용 — 회전 시 일괄 교체).
# OAuth client 는 piano 와 공유 (사람이 Google Console 에서 origins/redirect 에
# n-back.i-tems.com 추가). JWT_SECRET 도 piano 와 동일 — cross-app 검증은 각 DB
# 의 user_id 가 다르므로 자연 차단.
apiVersion: v1
kind: Secret
metadata:
  name: n-back-backend
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://nback:nback_secret@n-back-db.n-back-db-prd.svc.cluster.local:5432/nback
  GOOGLE_CLIENT_ID: REDACTED
  GOOGLE_CLIENT_SECRET: REDACTED
  JWT_SECRET: REDACTED
  FRONTEND_URL: https://n-back.i-tems.com
