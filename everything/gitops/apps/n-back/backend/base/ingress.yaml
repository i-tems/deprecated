apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n-back-backend
  namespace: n-back
spec:
  ingressClassName: traefik
  rules:
    - host: api-n-back.i-tems.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n-back-backend
                port:
                  number: 80
