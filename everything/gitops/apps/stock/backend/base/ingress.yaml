apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-backend
  namespace: stock
spec:
  ingressClassName: traefik
  rules:
    - host: api-bulls.i-tems.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-backend
                port:
                  number: 80
