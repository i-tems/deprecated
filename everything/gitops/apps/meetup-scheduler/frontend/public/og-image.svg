<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3182f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a56db;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>
  <!-- Calendar icon -->
  <g transform="translate(520, 140)">
    <rect x="0" y="20" width="160" height="150" rx="20" fill="white" opacity="0.95"/>
    <rect x="0" y="20" width="160" height="45" rx="20" fill="#1e40af"/>
    <rect x="0" y="45" width="160" height="20" fill="#1e40af"/>
    <circle cx="45" cy="38" r="5" fill="white" opacity="0.8"/>
    <circle cx="115" cy="38" r="5" fill="white" opacity="0.8"/>
    <!-- Calendar grid -->
    <rect x="25" y="80" width="22" height="22" rx="4" fill="#e8f0fe"/>
    <rect x="55" y="80" width="22" height="22" rx="4" fill="#e8f0fe"/>
    <rect x="85" y="80" width="22" height="22" rx="4" fill="#3182f6"/>
    <rect x="115" y="80" width="22" height="22" rx="4" fill="#e8f0fe"/>
    <rect x="25" y="110" width="22" height="22" rx="4" fill="#e8f0fe"/>
    <rect x="55" y="110" width="22" height="22" rx="4" fill="#3182f6"/>
    <rect x="85" y="110" width="22" height="22" rx="4" fill="#e8f0fe"/>
    <rect x="115" y="110" width="22" height="22" rx="4" fill="#a7f3d0"/>
    <rect x="25" y="140" width="22" height="22" rx="4" fill="#a7f3d0"/>
    <rect x="55" y="140" width="22" height="22" rx="4" fill="#e8f0fe"/>
    <!-- Check on the green one -->
    <text x="36" y="157" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">&#10003;</text>
    <text x="126" y="127" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">&#10003;</text>
  </g>
  <!-- Text -->
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" fill="white" text-anchor="middle" font-weight="800">
    모임 스케줄러
  </text>
  <text x="600" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.85">
    교대근무, 일반근무, 프리랜서 — 다 달라도 약속은 잡을 수 있어요
  </text>
  <!-- People dots -->
  <g transform="translate(490, 480)">
    <circle cx="0" cy="0" r="16" fill="#f04452" opacity="0.9"/>
    <circle cx="45" cy="0" r="16" fill="#ff9100" opacity="0.9"/>
    <circle cx="90" cy="0" r="16" fill="#00c853" opacity="0.9"/>
    <circle cx="135" cy="0" r="16" fill="#7c3aed" opacity="0.9"/>
    <circle cx="180" cy="0" r="16" fill="#ec4899" opacity="0.9"/>
    <circle cx="220" cy="0" r="16" fill="white" opacity="0.3"/>
    <text x="220" y="6" font-size="16" fill="white" text-anchor="middle" font-weight="bold">+</text>
  </g>
</svg>
