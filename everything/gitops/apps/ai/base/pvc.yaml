apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
# ai-claude PVC removed: claude credentials are no longer bootstrapped into a
# private PVC. They live on the shared NFS mount (see claude-share.yaml).
