<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI · items</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (_) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=3">
<link id="hljs-dark" rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css">
<link id="hljs-light" rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" disabled>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-header">
    <button id="new-chat" type="button" title="새 대화">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>새 대화</span>
    </button>
    <button id="sidebar-close" type="button" title="사이드바 닫기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <nav id="history-list"></nav>
</aside>

<!-- Main area -->
<div id="main-wrap">
  <header>
    <div class="header-left">
      <button id="sidebar-open" type="button" title="사이드바 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <h1>AI</h1>
    </div>
    <div class="header-right">
      <div id="usage" title="Max 구독 환산 사용량 (실제 청구는 월정액)"></div>
      <button id="theme-toggle" type="button" title="테마 전환" aria-label="테마 전환">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <div id="me"></div>
    </div>
  </header>

  <main id="app" hidden>
    <section id="output" class="markdown-body">
      <div class="placeholder">Claude Opus에게 무엇이든 물어보세요.</div>
    </section>

    <form id="composer">
      <textarea id="prompt" rows="3"
        placeholder="질문 입력 (Enter 전송, Shift+Enter 줄바꿈)" autofocus></textarea>
      <div class="controls">
        <label class="file-btn" for="files">
          <span>📎 첨부</span>
        </label>
        <input type="file" id="files" multiple hidden>
        <div id="file-list"></div>
        <div class="spacer"></div>
        <button id="cancel" type="button" hidden>중지</button>
        <button id="send" type="submit">전송</button>
      </div>
    </form>
    <footer id="status"></footer>
  </main>

  <section id="login" hidden>
    <div class="login-card">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56">
          <rect width="64" height="64" rx="14" fill="var(--accent)"/>
          <text x="32" y="43" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
                font-weight="700" font-size="28" fill="var(--on-accent)" letter-spacing="-1">AI</text>
        </svg>
      </div>
      <h2>AI · items</h2>
      <p class="login-desc">Claude Opus에게 질문을 보내는 내부 도구입니다.<br>계속하려면 Google 계정으로 로그인하세요.</p>
      <a class="btn btn-google" href="/auth/login">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20.4H24v7.2h11.3c-1.5 4.2-5.5 7.2-11.3 7.2-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.1-5.1C33.6 5.5 29 3.6 24 3.6 12.7 3.6 3.6 12.7 3.6 24S12.7 44.4 24 44.4 44.4 35.3 44.4 24c0-1.2-.1-2.3-.3-3.5z"/>
          <path fill="#FF3D00" d="M5.3 14l5.9 4.3C12.8 14.2 18 11 24 11c3 0 5.8 1.1 7.9 3l5.1-5.1C33.6 5.5 29 3.6 24 3.6c-7.3 0-13.6 3.9-17 9.7l-1.7.7z"/>
          <path fill="#4CAF50" d="M24 44.4c5 0 9.5-1.9 12.9-5l-5.9-4.9c-1.9 1.3-4.4 2.1-7 2.1-5.7 0-10.6-3.9-12.3-9.2l-6 4.6C9.5 40.1 16.2 44.4 24 44.4z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20.4H24v7.2h11.3c-.7 2-2 3.8-3.6 5l5.9 4.9c3.5-3.2 6-7.9 6-13.5 0-1.2-.1-2.3-.4-3.5z"/>
        </svg>
        <span>Google 계정으로 로그인</span>
      </a>
      <p class="login-foot">허용된 계정만 접근 가능합니다.</p>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script src="/static/app.js?v=11"></script>
</body>
</html>
