# hub HTTP 호출 부트스트랩 자격 — Schedule task pod 가 envFrom 으로 받는다.
#
# 사용 사상: pod 가 `HUB_INTERNAL_TOKEN` 으로 `/auth.caller_token` 을 호출해
# 자기 cell scope 의 caller JWT 를 받고, 그 JWT 로 hub capability 호출
# (`Authorization: Bearer` + `X-Cell-Id`). agent-loop 의 hub_client_bootstrap
# 과 동일한 패턴.
#
# ⚠ HUB_INTERNAL_TOKEN 은 hive ns 의 `hive-hub` Secret 의 동명 키 값과
# **정확히 일치**해야 한다 — 회전 시 양쪽을 같은 변경에서 갱신. 이 토큰을
# 가진 누구든 임의 cell_id 로 system principal 토큰을 발급받을 수 있으므로
# airflow ns 노출이 곧 lab 전체 cell scope 행세 권한이다. prd 전환 시
# cell-scoped 부트스트랩 토큰으로 좁히는 게 후속.
#
# metadata.namespace 의도적 생략 — ApplicationSet 의 destination.namespace 가
# ns 별로 박는다. 사용 ns 추가는 manifests/applicationset.yaml 의
# generators.list.elements 갱신.
apiVersion: v1
kind: Secret
metadata:
  name: hive-caller-creds
type: Opaque
stringData:
  HUB_URL: "http://hive-hub.hive.svc.cluster.local:8000"
  HUB_INTERNAL_TOKEN: "REDACTED"
