# hive-caller-creds — airflow ns Schedule task pod 가 hub HTTP 호출용
# (`/auth.caller_token` bootstrap → caller JWT) 자격을 받는 Secret 의
# root Application. 실제 destination ns 별 fan-out 은
# manifests/applicationset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hive-caller-creds
  namespace: argocd
  annotations:
    # Schedule 이 envFrom 으로 참조하므로 Schedule task pod 보다 먼저 존재해야
    # 안전. data-platform-secret 와 동일 wave.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/i-tems/everything.git
    targetRevision: main
    path: gitops/platform/hive-caller-creds/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
