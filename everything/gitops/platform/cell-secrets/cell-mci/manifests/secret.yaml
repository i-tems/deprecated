# cell-mci ns 의 앱이 meta App `spec.secretEnv` 로 참조하는 Secret.
#
# 규약: meta 가 env 를 valueFrom.secretKeyRef{name:<app>-secrets,key:<k>}
# 로 렌더한다 → Secret 이름은 `<app>-secrets`, key 는 meta.yaml secretEnv
# 의 값과 일치해야 한다. cell 앱 repo(i-tems/cell-mci)에는 *참조만* 있고
# 실값은 이 private monorepo 에만 둔다 (cell 개발자·Gitea read 광범위
# 노출면에서 플랫폼 메인테이너로 좁힘 — meta/manifests/secret.yaml 과 동일
# 평문-private-git posture, prod 전환 시 sealed-secrets 도입 대상).
#
# ⚠ 회전 절차:
#   1. Anthropic Console 에서 키 폐기·재발급 (workspace-scoped + spend cap
#      권장 — bible-ai 전용 키로 blast radius 최소화).
#   2. 아래 anthropic-api-key 값을 신규 키로 교체, 이 커밋을 머지.
#   3. ArgoCD selfHeal 이 ns 에 반영. 기존 pod 는 env 가 secretKeyRef 라
#      Secret 갱신만으로 자동 반영되지 않으므로 bible-ai Deployment 를
#      롤아웃(rollout restart)해 신규 키를 픽업한다.
#
# 현재 값은 placeholder 다 — 직전 노출 키(sk-ant-…BWQQ)는 git 히스토리·
# Gitea 미러에 남아 burned. 절대 재사용 금지. 위 회전 절차로 신규 키 주입.
apiVersion: v1
kind: Secret
metadata:
  name: bible-ai-secrets
  namespace: cell-mci
type: Opaque
stringData:
  anthropic-api-key: REDACTED
