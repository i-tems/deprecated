server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver __CLUSTER_DNS__ ipv6=off valid=10s;
    # FQDN: hive-ui와 hive-hub가 다른 namespace에 있어 짧은 이름은 안 됨.
    set $hub_upstream hive-hub.hive.svc.cluster.local:8000;
    set $container_upstream hive-capability-container.hive.svc.cluster.local:8000;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com ws: wss:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/openapi.json { return 404; }
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /container/openapi.json { return 404; }
    location = /container/docs { return 404; }
    location = /container/redoc { return 404; }

    # API proxy to hub
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$hub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # SSE/streaming support
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Container proxy (sandbox terminal websocket + container APIs)
    location /container/ {
        rewrite ^/container/(.*)$ /$1 break;
        proxy_pass http://$container_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — index.html must not be cached so new asset hashes take effect
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
