apiVersion: v1
kind: Service
metadata:
  name: hive-capability-web
  namespace: hive
  labels:
    app: hive-capability-web
spec:
  type: ClusterIP
  selector:
    app: hive-capability-web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-capability-web
  namespace: hive
  labels:
    app: hive-capability-web
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hive-capability-web
  template:
    metadata:
      labels:
        app: hive-capability-web
    spec:
      serviceAccountName: hive-capability-web
      containers:
        - name: web
          image: registry.lab.i-tems.com/hive-capability-web:SEED
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: hive-capability-web
          volumeMounts:
            # 원본 저장소 — hive-data PVC 의 shared 서브트리만 마운트(최소 권한).
            # 워커(/data 전체 마운트)가 /data/shared/web-cache 로 같은 파일을 읽는다.
            - name: shared
              mountPath: /data/shared
              subPath: shared
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: hive-data
