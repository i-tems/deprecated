apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hive-capability-query
  namespace: hive
spec:
  podSelector:
    matchLabels:
      app: hive-capability-query
  policyTypes:
    - Ingress
  ingress:
    # hub: capability 프록시
    - from:
        - podSelector:
            matchLabels:
              app: hive-hub
      ports:
        - port: 8000
          protocol: TCP
