apiVersion: v1
kind: Service
metadata:
  name: hive-capability-slack
  namespace: hive
spec:
  type: ClusterIP
  selector:
    app: hive-capability-slack
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-capability-slack
  namespace: hive
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: hive-capability-slack
  template:
    metadata:
      labels:
        app: hive-capability-slack
    spec:
      containers:
        - name: slack
          image: registry.lab.i-tems.com/hive-capability-slack:SEED
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: hive-data
              mountPath: /data
            - name: hive-data
              mountPath: /var/data
              subPath: capabilities/slack/data
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
      volumes:
        - name: hive-data
          persistentVolumeClaim: { claimName: hive-data }
