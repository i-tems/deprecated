# container capability가 hive ns 안에서 sandbox Pod을 관리하기 위한 권한.
# (단일 namespace 방식이라 cluster-scoped 권한 불필요)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-capability-container
  namespace: hive
rules:
  # sandbox Pod 라이프사이클
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # Pod 안에서 명령 실행 (sandbox.exec, sandbox.ws)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Pod 상태 확인용
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-capability-container
  namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-capability-container
subjects:
  - kind: ServiceAccount
    name: hive-capability-container
    namespace: hive
