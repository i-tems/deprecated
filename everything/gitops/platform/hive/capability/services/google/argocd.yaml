apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hive-capability-google
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/i-tems/everything.git
    targetRevision: main
    path: gitops/platform/hive/capability/services/google/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: hive
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
