# agent-loop이 worker Job/Pod를 hive ns 안에 spawn·watch·reap 할 수 있도록 권한.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-agent-loop-jobs
  namespace: hive
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-agent-loop-jobs
  namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-agent-loop-jobs
subjects:
  - kind: ServiceAccount
    name: hive-agent-loop
    namespace: hive
