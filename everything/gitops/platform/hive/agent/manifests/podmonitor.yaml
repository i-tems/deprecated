apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: hive-agent-loop
  namespace: hive
  labels:
    release: kps  # kube-prometheus-stack 의 Prometheus 가 release=kps 라벨로 검색
spec:
  selector:
    matchLabels:
      app: hive-agent-loop
  podMetricsEndpoints:
    - port: metrics  # containerPort 8002 — main loop 의 prometheus_client.start_http_server
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
