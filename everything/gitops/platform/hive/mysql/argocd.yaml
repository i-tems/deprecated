apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hive-mysql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # hub(10)·agent(20)보다 먼저
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/i-tems/everything.git
    targetRevision: main
    path: gitops/platform/hive/mysql/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: hive
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # StatefulSet의 volumeClaimTemplates에 API 서버가 자동 채워 넣는 필드는 무시.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
