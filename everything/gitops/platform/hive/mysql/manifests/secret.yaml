# Lab-default MySQL credentials. cluster 내부 한정 노출이라 일단 그대로 둔다.
# 외부 노출 시점에 강한 랜덤으로 회전 + sealed-secrets 도입.
apiVersion: v1
kind: Secret
metadata:
  name: hive-mysql
  namespace: hive
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: hive-mysql-root-change-me
  MYSQL_DATABASE: hive
  MYSQL_USER: hive
  MYSQL_PASSWORD: hive-mysql-change-me
---
# hub가 환경변수로 사용하는 동일한 자격증명 (편의상 별 Secret로 노출).
apiVersion: v1
kind: Secret
metadata:
  name: hive-hub-db
  namespace: hive
type: Opaque
stringData:
  DB_HOST: hive-mysql.hive.svc.cluster.local
  DB_PORT: "3306"
  DB_NAME: hive
  DB_USER: hive
  DB_PASSWORD: hive-mysql-change-me
