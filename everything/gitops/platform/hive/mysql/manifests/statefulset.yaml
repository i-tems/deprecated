apiVersion: v1
kind: Service
metadata:
  name: hive-mysql
  namespace: hive
  labels:
    app: hive-mysql
spec:
  type: ClusterIP
  selector:
    app: hive-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-mysql
  namespace: hive
spec:
  serviceName: hive-mysql
  replicas: 0
  selector:
    matchLabels:
      app: hive-mysql
  template:
    metadata:
      labels:
        app: hive-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: hive-mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"'
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 1, memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
