apiVersion: v1
kind: Service
metadata:
  name: lens
  namespace: lens
spec:
  type: ClusterIP
  selector:
    app: lens
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lens
  namespace: lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lens
  template:
    metadata:
      labels:
        app: lens
    spec:
      containers:
        - name: lens
          image: registry.lab.i-tems.com/lens:SEED
          ports:
            - containerPort: 8000
          # hive-caller-creds: HUB_URL + HUB_INTERNAL_TOKEN (caller_token 부트스트랩).
          # ApplicationSet 가 lens ns 에 동기화 (manifests/applicationset.yaml elements).
          envFrom:
            - secretRef:
                name: hive-caller-creds
          env:
            - name: LENS_CELL
              value: infra
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
