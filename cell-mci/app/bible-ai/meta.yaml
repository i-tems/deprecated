apiVersion: meta.i-tems.com/v1
kind: App
metadata:
  name: bible-ai
spec:
  image: registry.lab.i-tems.com/mci-app-bible-ai   # 태그는 meta 가 소스 sha 로 해석
  port: 3000
  domain: i-tems.com                            # prd host = bible-ai.i-tems.com
  env:
    HOSTNAME: "0.0.0.0"
    PORT: "3000"
  # 비밀은 평문 env 금지(git·Gitea 미러·렌더 산출물 노출). meta 가
  # valueFrom.secretKeyRef 로 렌더하고, 실값은 플랫폼이 별도 프로비저닝:
  # everything gitops/platform/cell-secrets/cell-mci → Secret
  # `bible-ai-secrets` key `anthropic-api-key`.
  secretEnv:
    ANTHROPIC_API_KEY: anthropic-api-key
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # securityContext / automountServiceAccountToken 은 적지 않는다 —
  # meta 가 강화 기본을 플랫폼 차원에서 강제 주입한다(작성자 권한 약화 불가).
  environments:
    prd: { from: main }                          # main 커밋 → prd 직접 (dev/promote 미사용)
